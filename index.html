<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>10x10 Grid Color Flip</title>
  <style>
    body {
      display: flex; 
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f0f0f0;
    }
    .title {
      font-size: 2.5rem;
      font-weight: bold;
      color: #333;
      margin-bottom: 1rem;
      text-align: center;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
      font-family: 'Arial', sans-serif;
    }
    #container {
      display: grid;
      grid-template-columns: repeat(12, 40px);
      grid-template-rows: repeat(12, 40px);
      gap: 2px;
    }
    .cell {
      width: 40px;
      height: 40px;
      background-color: white;
      border: 1px solid #ccc;
      cursor: pointer;
    }
    .red {
      background-color: red;
    }
    .border-cell {
      background-color: #ddd;
      border: none;
      cursor: default;
      width: 40px;
      height: 40px;
      min-width: 40px;
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .even {
      /* 랜덤색은 JS에서 적용 */
    }
    .odd {
      background-color: #e57373; /* 빨강: 홀수 */
    }
  </style>
</head>
<body>
  <h1 class="title">Binary Number Game</h1>
  <div id="container"></div>

  <script>
    const gridSize = 10;
    const container = document.getElementById('container');
    const cells = [];

    // 격자 + 외곽 테두리 생성
    for (let row = 0; row < gridSize + 2; row++) {
      cells[row] = [];
      for (let col = 0; col < gridSize + 2; col++) {
        const cell = document.createElement('div');
        if (row === 0 || row === gridSize + 1 || col === 0 || col === gridSize + 1) {
          // 외곽 테두리
          cell.classList.add('border-cell');
        } else {
          // 내부 셀
          cell.classList.add('cell');
          if (Math.random() > 0.5) cell.classList.add('red');
          cell.addEventListener('click', () => {
            cell.classList.toggle('red');
            updateBorderColors();
          });
          // 10x10 격자판의 테두리만 진한 검정색
          let border = '';
          if (row === 1) border += 'border-top: 2.5px solid #000;';
          if (row === gridSize) border += 'border-bottom: 2.5px solid #000;';
          if (col === 1) border += 'border-left: 2.5px solid #000;';
          if (col === gridSize) border += 'border-right: 2.5px solid #000;';
          cell.style = border;
        }
        container.appendChild(cell);
        cells[row][col] = cell;
      }
    }

    function updateBorderColors() {
      // 외곽 테두리 색상 변경하지 않음
    }

    // 초기 테두리 색상 설정
    updateBorderColors();
  </script>
</body>
</html>
